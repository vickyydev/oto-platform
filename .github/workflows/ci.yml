      # the BEO's Save keeping the code, and otoapp_v.event_packages (migration
      # 0047) naming it; then the form under jsdom: nothing asked until it
      # reads, one ask per press, a refusal said with no line handed over, the
      # retry the same press.
      - name: The app's party menu item checks
        if: steps.changes.outputs.app == 'true'
        run: npx tsx tests/party-menu-item.check.ts
      - name: The app's party menu item form check
        if: steps.changes.outputs.app == 'true'
        env:
          TSX_TSCONFIG_PATH: tests/tsconfig.jsx.json
        run: npx tsx tests/party-menu-item-ui.check.ts
      # SCRUM-822: a party's money in the BEO, read from the till — satang
      # shown as baht one way only (SCRUM-833), the client asking with the
      # provision key and never a session, the till's figures answered for a
