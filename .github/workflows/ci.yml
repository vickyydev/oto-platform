name: CI

on:
  push:
    paths-ignore: ['imports/**', 'docs/**']
  pull_request:
    paths-ignore: ['imports/**', 'docs/**']
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oto
          POSTGRES_PASSWORD: oto
          POSTGRES_DB: oto
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U oto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://oto:oto@localhost:5433/oto
      TEST_DATABASE_URL: postgres://oto:oto@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Migrations apply cleanly from empty (twice)
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - name: Seed
        run: pnpm db:seed
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # Staging deploys are gated on CI, not on the push: every service in
  # render.yaml sets `autoDeploy: false`, so Render does nothing until a hook
  # below is called. A red build therefore never reaches the client's staging
  # URL. Nothing is configured yet — the owner has no Render account connected
  # — and until the secrets exist this job is a green no-op.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two pushes landing together would otherwise race two deploys through the
    # same pre-deploy migration step. Queue them instead of cancelling: the
    # second push still has to reach staging.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # Secrets cannot be read from a job-level `if`, so they come in as env and
    # each step skips itself when its hook is unset. Skipped, not failed.
    env:
      RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      RENDER_DEPLOY_HOOK_POS: ${{ secrets.RENDER_DEPLOY_HOOK_POS }}
    steps:
      # The api goes first: its pre-deploy step runs the migrations, and the
      # POS is built against whatever the api then serves. The hook returns as
      # soon as Render accepts the deploy, so this does not wait for either to
      # go live — it triggers, it does not verify. Verifying needs a Render API
      # key and a poll, which is worth adding once there is an account to test
      # it against.
      - name: Deploy the api
        if: env.RENDER_DEPLOY_HOOK_API != ''
        run: curl --fail --silent --show-error --output /dev/null "$RENDER_DEPLOY_HOOK_API"
      - name: Deploy the POS
        if: env.RENDER_DEPLOY_HOOK_POS != ''
        run: curl --fail --silent --show-error --output /dev/null "$RENDER_DEPLOY_HOOK_POS"
      # Says so in the log rather than leaving a job of nothing but skipped
      # steps, which reads like a broken workflow.
      - name: No deploy target configured
        if: env.RENDER_DEPLOY_HOOK_API == '' && env.RENDER_DEPLOY_HOOK_POS == ''
        run: echo "No Render deploy hooks configured — nothing to deploy. Set RENDER_DEPLOY_HOOK_API and RENDER_DEPLOY_HOOK_POS once the Render blueprint is applied."
