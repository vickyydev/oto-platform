      - name: The app's payroll feeds checks
        if: steps.changes.outputs.app == 'true'
        run: npx tsx tests/payroll-feeds.check.ts
      # SCRUM-569: the company payroll's R4 (migration 0025) — the golden step
      # above now also runs the lifecycle leg (GM confirm, Owner lock, paid,
      # reopen, another park group's 404s; checks 10-11 on the stored bytes).
      # This check: every transition and refusal in plain words by role and
      # state, the source signature voided by an input change and by an
