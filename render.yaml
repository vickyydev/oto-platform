# OTO Platform — Render blueprint (S2-01c, extended by S2-02)
#
# This file declares the staging environment: the api web service, the two
# static sites in front of it — the POS and the suite launcher — and the
# managed Postgres they share. It is the whole deployment, in one file, in the
# repository — which is the trade DEPLOYMENT_TOPOLOGY.md accepts for having
# many small deployables instead of one server.
#
# How to apply it: Render dashboard → New → Blueprint → point it at this repo.
# Render creates everything below and prompts for each value marked
# `sync: false`. Nothing here contains a secret; the values live only in the
# dashboard.
#
# Four things will NOT work until the owner acts, and each is called out again
# where it appears:
#   1. MINIO_* must point at a real S3-compatible bucket. The api refuses to
#      boot in production on the development storage keys (apps/api/src/env.ts,
#      `assertProductionSafe`) — deliberately, so a deploy cannot quietly put
#      a member's files somewhere wrong.
#   2. TWILIO_* must carry a real Twilio sender — the account SID, a sending
#      number, and either an API key or the account auth token. Verification
#      and reset codes go to a phone on every deployment, staging included, and
#      the api refuses to start on a deployment that has no way to send one.
#   3. ALLOWED_ORIGINS must carry BOTH static sites' origins once Render has
#      issued them — the POS and the launcher. Every write from a site left
#      out is refused with ORIGIN_NOT_ALLOWED, and each site writes under its
#      own origin, so listing one does not cover the other.
#   4. HANDOFF_SIGNING_KEY must carry a key the owner chose, or the two
#      hand-off routes answer 503 and a tile on the launcher cannot open the
#      app it names. Unlike the three above this does not stop the api
#      booting: sign-in on each app's own origin still works, so the failure
#      is a launcher that shows tiles and refuses to follow them.
#
# Production is a second environment, added when the park cuts over: the same
# services with `SEED_PROFILE`/`OPS_TEST_CONTROLS` dropped, its own Twilio
# sender and payment credentials, its own hand-off keyring, and its own
# database. It is not declared yet — staging is where the park's team play
# during Sprint 2.
#
# Deploys are gated on CI, not on the push: all three services set
# `autoDeployTrigger: checksPass`, so Render watches this repository, waits for
# the commit status of the `ci` workflow and deploys only when it is green. A
# red build therefore never reaches the staging URL. The rejected alternative
# — a deploy hook or a Render API key in repository secrets — would put a key
# to the whole workspace within reach of anyone who can push a workflow file,
# which is why .github/workflows/ci.yml deliberately has no deploy job.
# (`autoDeployTrigger` replaces the deprecated `autoDeploy` and takes
# precedence over it where both appear.)

databases:
  - name: oto-db-staging
    databaseName: oto
    # One login per service is the target (DEPLOYMENT_TOPOLOGY.md item 5) so a
    # connection leak in one app cannot starve the others. Today there is one
    # service, so there is one login; the split happens as the lifted apps land
    # and each gets its own role with its own connection limit.
    user: oto_platform
    region: singapore
    postgresMajorVersion: '16'
    # Point-in-time recovery is a property of the instance type, not a flag:
    # every PAID Render Postgres instance keeps daily backups plus PITR (the
    # free instance type keeps neither, and expires). Any paid type is
    # therefore the floor for a database holding member and child records, even
    # on staging. Confirm the retention window in the dashboard after the first
    # deploy — that is where Render shows it.
    #
    # `1c-2g` (1 CPU, 2 GB) rather than the cheapest paid type, for three
    # are all work this database is already scheduled to do:
    #   - S2-22 restores the park's own data here: a 33 MB dump of 184 tables
    #     and 519 foreign keys, loaded into a scratch database on THIS server,
    #     renamed, dumped again and restored with `pg_restore -j4`. Two copies
    #     of the data and four parallel workers want more than half a core.
    #   - Radar's rollups (S2-18) and the analytics summary (S2-15b) scan the
    #     sales tables on a schedule, beside the till's own queries. The whole
    #     dataset is 33 MB, so 2 GB holds that working set in cache many times
    #     over; the next size up would be buying headroom for a park that does
    #     not exist yet.
    #   - the connection ceiling, which the api's maxInstances is derived from.
    #
    # Sizing up is a plan change in the dashboard, applied with a restart, and
    # the connection budget below is written against the lowest paid ceiling so
    # it survives the move. Sizing DOWN is not symmetrical — the disk grows
    # with the data and can never be shrunk — which is why the smaller paid
    # type is the one to start on.
    #
    # CONNECTION CEILING — the api's scaling block depends on this number.
    # Render publishes a fixed limit per instance type and the basic range
    # carries the smallest. Everything below is budgeted against 97, the lowest
    # figure any paid type carries, so the arithmetic holds even if this
    # instance turns out to be on the smaller number. Confirm the real limit in
    # the dashboard after the first deploy, and raise the budget then — never
    # lower it silently.
    #
    #   superuser reserve + Render's own monitoring            ~5
    #   api web service, pool of 10 x 3 instances               30
    #   pre-deploy migration (overlaps the running instances)    1
    #   jobs worker, once it splits out of the api              10
    #   lifted OTO App (S2-17b) and Radar (S2-18), 10 each      20
    #   a person on psql, or a one-off seed                      2
    #                                                     total 68  of 97
    #
    # A fourth api instance takes that to 78 and a fifth to 88, which is too
    # close to the ceiling to spend on a guess.
    #
    # Storage is deliberately not declared. Render sizes the disk with the
    # instance type and grows it from the dashboard, and a disk can never be
    # shrunk — a number guessed in a blueprint is a number you live with. The
    # S2-22 restore holds the data twice over while it runs, so check the disk
    # before running it rather than after.
    plan: 1c-2g
    # Empty = no connections from the public internet; only services in this
    # Render workspace can reach it. To run a one-off psql or the demo seed
    # from a laptop, add that address here temporarily and remove it after.
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # api — Fastify 5. One process, three roles (PROCESS_ROLES below).
  # ---------------------------------------------------------------------------
  - type: web
    name: oto-api-staging
    runtime: node
    region: singapore
    # `standard` (1 CPU, 2 GB) rather than `starter` (0.5 CPU, 512 MB). What
    # the process actually does decides it:
    #   - every sign-in and every unlock runs argon2id (@node-rs/argon2 at its
    #     defaults: 19 MiB and two passes per hash) and the binding runs on
    #     libuv's thread pool, so four concurrent hashes are ~80 MiB of
    #     transient memory and four threads of pure CPU. On half a core that
    #     contends with the till's own requests; on 512 MB it sits next to the
    #     V8 heap and the pg pool. Reception signing on at opening is exactly
    #     when both happen at once.
    #   - one process also carries `edge` and `jobs` (PROCESS_ROLES below), so
    #     a rollup's memory and a sale's latency share a container.
    #   - autoscaling on Render starts at `standard`. Choosing it now means the
    #     scaling block below is uncommented when the roles split out, instead
    #     of a plan change made under pressure.
    # `free` is not a candidate at all: free instances spin down when idle, so
    # the first till request of the morning would wait for a cold start, and a
    # pre-deploy command needs a paid instance type in any case.
    plan: standard
    branch: main
    # The repository root, because this is a pnpm workspace: the api's
    # dependencies are resolved from the root lockfile and half of what it
    # imports lives in packages/.
    rootDir: .
    # `--prod=false` is load-bearing. NODE_ENV=production is set below, and
    # pnpm would otherwise skip devDependencies — which is where tsx (the
    # runtime for the start command) and drizzle-kit (the migrator for the
    # pre-deploy command) live. The install would succeed and the start would
    # fail with "tsx: not found".
    # `corepack enable` takes the pnpm version from package.json's
    # `packageManager` field. If the build image ever refuses it, the
    # equivalent is `npm i -g pnpm@10.33.0` — keep it pinned either way.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    # Runs after the build, before the new instance takes traffic, with this
    # service's environment. Two steps, in this order:
    #   db:migrate       forward-only Drizzle migrations; expand/contract from
    #                    0006 onward, so the OLD instance keeps serving happily
    #                    while this runs (CONTRIBUTING.md).
    #   db:platform-sync the re-runnable half of the seed — system roles and
    #                    their permissions converge on every deploy, so a
    #                    permission added to a bundle actually reaches staging.
    #                    It touches no demo rows, so a password changed on
    #                    staging survives.
    # When S2-03 adds pg-boss, its own migration goes here as a third step: it
    # owns the `pgboss` schema, outside Drizzle's schemaFilter.
    # A failure here cancels the deploy and leaves the previous instance
    # serving — a migration that will not apply never becomes an outage.
    preDeployCommand: pnpm db:migrate && pnpm db:platform-sync
    # index.ts drains on SIGTERM so a deploy does not drop a request mid-sale.
    # That depends on the signal reaching it through the pnpm wrapper: if the
    # logs ever show a restart without the "shutting down" line, the wrapper is
    # the suspect and the fix is to invoke tsx directly.
    startCommand: pnpm --filter @oto/api start
    # /ready checks the database (`select 1`) and answers 503 when it cannot
    # reach it, so Render holds traffic off an instance that cannot serve.
    # /health answers without touching the database — use that one for uptime
    # pings, or every outage becomes two alerts.
    healthCheckPath: /ready
    # ONE INSTANCE, DELIBERATELY. The autoscaling that replaces it is written
    # out below rather than left to be invented later under pressure.
    #
    # Why one: this process carries three roles (PROCESS_ROLES below). `edge`
    # is the cloud virtual box and holds one station session per station in
    # memory; `jobs` is the scheduled runner — pg-boss under advisory locks,
    # the watchdog, the rollups, the housekeeping sweeps (S2-03). Neither
    # survives being run twice. A second instance gives the box a second brain
    # and runs every schedule once per instance, and autoscaling would not
    # announce that: it would simply start happening on the first busy
    # afternoon and show up as duplicated rollups.
    #
    # What unlocks the scaling block, in order:
    #   1. enable the `worker` service at the foot of this file and remove
    #      `jobs` from PROCESS_ROLES below;
    #   2. give `edge` the same treatment — its own service, `edge` removed
    #      from PROCESS_ROLES — or make the virtual box's state a database row
    #      that any instance can serve;
    #   3. delete `numInstances` and uncomment `scaling`.
    # Until all three are done, raising this number is a bug, not a scale-up.
    #
    # One more thing holds it at one instance from S2-02: `handoff_token` rows
    # are claimed in the database, not in memory, so the hand-off itself is
    # safe across instances — but the same is not yet true of the edge role
    # above, so do not read a working hand-off as permission to scale out.
    numInstances: 1
    # maxInstances is the database's arithmetic, not a preference: the pool is
    # 10 connections per instance (packages/db/src/index.ts, `max`), so three
    # instances hold the 30 budgeted on the database above. Going past three
    # means lowering that pool or putting a pooler in front — and a
    # transaction-mode pooler is not free here, because Radar's advisory locks
    # and our session-level settings need a direct connection.
    # CPU is the signal that matters: argon2id makes sign-in CPU-bound, while
    # memory stays flat because nothing large is held between requests. The
    # memory target is a backstop, not the trigger.
    # scaling:
    #   minInstances: 1
    #   maxInstances: 3
    #   targetCPUPercent: 60
    #   targetMemoryPercent: 70
    # Deploy when CI is green, never on the bare push — see the note at the
    # head of this file for why no deploy credential exists on the GitHub side.
    autoDeployTrigger: checksPass
    envVars:
      # -- runtime ----------------------------------------------------------
      - key: NODE_VERSION
        # package.json engines requires >=22.12; the 22 line satisfies it and
        # matches what CI installs.
        value: '22'
      - key: NODE_ENV
        value: production
      # WHICH deployment this is, as distinct from how the code is built.
      # Staging runs the production build against throwaway data, so this -
      # not NODE_ENV - is what keeps the demo controls off production.
      - key: DEPLOY_ENV
        value: staging
      - key: TZ
        # Every process stores UTC and converts at the edge using the branch
        # timezone. A server on Asia/Bangkok would make `business_date` depend
        # on where the code happens to run.
        value: UTC
      # PORT is injected by Render and wins over API_PORT in apps/api/src/index.ts,
      # so API_PORT is deliberately not set here — it is the local-dev default only.
      - key: LOG_LEVEL
        value: info
      - key: PROCESS_ROLES
        # A recorded deviation from DEPLOYMENT_TOPOLOGY.md: edge and jobs run
        # inside the api service instead of their own, because one park with
        # one virtual box does not justify three services yet. It is a
        # configuration change to undo, not a rewrite — and it is also what
        # holds this service at one instance, so undoing it is what buys
        # horizontal scale.
        value: api,edge,jobs

      # -- how the api sits behind Render's proxy ----------------------------
      - key: TRUST_PROXY
        # One hop: Render's load balancer. req.ip then reads the entry before
        # Render's own, which is the caller — and a forged X-Forwarded-For
        # cannot move that caller into a fresh rate-limit bucket.
        value: '1'
      - key: COOKIE_SECURE
        # HTTPS only. The api refuses to boot in production without this.
        value: 'true'
      - key: ALLOWED_ORIGINS
        # BLOCKS THE FIRST DEPLOY IF LEFT BLANK. Each static site is served
        # from its own origin and reaches the api through that site's /api
        # rewrite, so a browser write arrives with Origin = the site and
        # Host = this service. They differ, so the same-origin fallback in
        # apps/api/src/app.ts does not apply and every origin must be listed
        # here explicitly.
        #
        # BOTH static sites belong here, comma-separated: the POS and the
        # launcher. The launcher is not merely a link page — it signs in, mints
        # hand-offs and runs its own account page, so its writes carry its own
        # Origin and are refused ORIGIN_NOT_ALLOWED if only the POS is listed.
        # Scheme and host, no trailing slash, e.g.
        # https://oto-pos-staging.onrender.com,https://oto-launcher-staging.onrender.com
        # The console site joins them in S2-03.
        sync: false

      # -- suite hand-off (S2-02) -------------------------------------------
      # One platform session, several app origins. A parent-domain cookie
      # cannot carry it: onrender.com is on the public suffix list, so no
      # cookie may be set for it, and even a real parent domain would not
      # reach the booking site's separate domain later. So the launcher asks
      # this api for a short-lived signed token aimed at ONE app, the browser
      # carries it in the URL fragment, and that app exchanges it for its own
      # cookie bound to the same session row. Revoking the session ends every
      # app at once, because there is no second credential to forget.
      - key: HANDOFF_SIGNING_KEY
        # A KEYRING, newest first: `<kid>:<secret>,<kid>:<secret>`. The first
        # entry signs; the rest still verify, so rotation is expand/contract
        # like a migration — prepend the new key, deploy, and drop the old
        # entry once every token it signed has expired (one TTL below).
        # Generate a secret the way you would any other: 32+ random
        # characters, e.g. `openssl rand -hex 32`.
        #
        # Left blank the hand-off is UNAVAILABLE rather than improvised: both
        # routes answer 503. A key minted at boot would differ between
        # restarts and between instances, and a key nobody chose is a key
        # nobody can rotate.
        sync: false
      - key: HANDOFF_APP_ORIGINS
        # Where each app answers, as `<app>=<origin>` pairs. The exchange
        # compares the request's Origin with the one recorded when the token
        # was signed, so a token minted for the till cannot be spent on the
        # console. Every origin named here must also appear in
        # ALLOWED_ORIGINS above, or the exchange is refused before it reaches
        # the route.
        #
        # THE LAUNCHER IS ABSENT ON PURPOSE. It is the issuer, not a target:
        # nothing is ever handed off *to* it, and `launcher` is not one of the
        # audiences in packages/db (pos, console, oto_app, radar, booth,
        # inbox). Adding it here does not degrade quietly — the api refuses to
        # boot, naming the unknown app, which is how this was learned.
        #
        # Literal hosts, like the POS rewrite below: a blueprint cannot
        # reference another service's URL. Correct them if Render issues a
        # suffixed hostname. Comma-separated as the console and the lifted
        # apps land.
        value: pos=https://oto-pos-staging.onrender.com
      - key: HANDOFF_TOKEN_TTL_S
        # The seconds a browser needs to carry a token from one origin to the
        # next, not minutes: long enough for a redirect, short enough that a
        # token left in someone's history is worth nothing by the time it is
        # read. Replay is stopped by the single-use jti, not by this — the TTL
        # is what bounds the window before the jti row is even consulted.
        value: '60'

      # -- database ----------------------------------------------------------
      - key: DATABASE_URL
        fromDatabase:
          name: oto-db-staging
          # The internal connection string: a direct connection inside Render's
          # private network, not a transaction pooler. Radar's advisory locks
          # and our session-level settings need a direct connection.
          property: connectionString

      # -- sessions, throttles and replay ------------------------------------
      - key: SESSION_TTL_HOURS
        value: '12'
      - key: AUTH_MAX_FAILURES
        value: '5'
      - key: AUTH_COOLDOWN_SECONDS
        value: '300'
      - key: CODE_MAX_ATTEMPTS
        value: '5'
      - key: RATE_LIMIT_IP_MAX
        # Generous on purpose: a shopping mall shares very few public
        # addresses, so the tight bucket is the per-phone one below.
        value: '120'
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: '60'
      - key: RATE_LIMIT_CODE_MAX
        value: '5'
      - key: RATE_LIMIT_CODE_WINDOW_SECONDS
        value: '900'
      - key: IDEMPOTENCY_TTL_HOURS
        value: '24'

      # -- object storage ----------------------------------------------------
      # There is no MinIO on Render; MinIO is the local stand-in for whatever
      # S3-compatible bucket this points at (Cloudflare R2, AWS S3, Backblaze
      # B2 — the SDK is generic). The api REFUSES TO BOOT in production while
      # the access key or secret is still the development default, so these
      # four block the first deploy until the owner creates a bucket.
      - key: MINIO_ENDPOINT
        # Host only, no scheme and no bucket, e.g. s3.ap-southeast-1.amazonaws.com
        sync: false
      - key: MINIO_PORT
        value: '443'
      - key: MINIO_USE_SSL
        value: 'true'
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      # Cloudflare R2 wants `auto`. Set explicitly so the SDK never probes for
      # the region — presigning then touches the network not at all.
      - key: MINIO_REGION
        value: auto
      - key: MINIO_BUCKET
        # Suggested: oto-files-staging. Keep staging and production in
        # different buckets — the demo reset must never reach a real file.
        sync: false

      # -- staging profile ---------------------------------------------------
      # These three are what make this deployment a playground, and they are
      # the three to change when production is declared. SMS used to be a
      # fourth; it is not any more — see the block below.
      #
      # Note what they are NOT gated on. This service runs NODE_ENV=production
      # — it is the real build, with the real hardening: no development
      # database, no demo storage keys, a secure cookie, or it does not start.
      # "Production build" and "throwaway data" are therefore different
      # questions, and each flag below answers the second one explicitly rather
      # than being inferred from NODE_ENV. Anything inferred would either lock
      # staging out of its own controls or hand them to production by accident.
      - key: SEED_PROFILE
        # `staging` seeds the demo tenant and marks this database a playground.
        # `production` on a real deployment.
        value: staging
      - key: ALERT_CHANNELS
        # console until the owner names a channel (open decision 17). Read by
        # the alerting built in S2-03.
        value: console
      - key: OPS_TEST_CONTROLS
        # Opens the destructive operational controls: "Reset demo data" today,
        # device fault injection and "expire hand-off now" as they land. FALSE
        # ON A REAL DEPLOYMENT — this is the flag that lets a platform admin
        # wipe the facts out of a database.
        value: 'true'

      # -- SMS ---------------------------------------------------------------
      # Real SMS, on staging as much as on production. A setup code, a password
      # reset, anything that proves a phone belongs to the person holding it —
      # all of it goes to the phone.
      #
      # This was the console adapter, and the argument for it was that staging
      # could complete a sign-up without an SMS bill. The argument against is
      # the stronger one: a verification code printed into a hosted log stream
      # is a live credential sitting where everyone with log access can read
      # it, and a delivery path exercised only in production is a delivery path
      # nobody has tested. Staging runs the production build; it runs the
      # production SMS route too.
      #
      # THE SERVICE WILL NOT START UNTIL THE CREDENTIALS ARE SET, and that is
      # the point: a deployment with no way to reach a phone would otherwise
      # fall back to logging codes and look perfectly healthy doing it.
      #
      # WHAT TO SET: TWILIO_ACCOUNT_SID, TWILIO_FROM, and ONE of
      #   - TWILIO_API_KEY_SID + TWILIO_API_KEY_SECRET  (recommended), or
      #   - TWILIO_AUTH_TOKEN                           (the fallback).
      # Leave the unused shape blank. Half a key pair is refused at boot rather
      # than quietly authenticating as the whole account instead.
      - key: SMS_ADAPTER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        # console.twilio.com → Account SID, begins "AC". Required either way:
        # it names the account in the request URL rather than authenticating.
        sync: false
      - key: TWILIO_API_KEY_SID
        # Account → API keys & tokens → Create API key, type Standard. Begins
        # "SK". Preferred over the auth token: revoked and rotated on its own,
        # so replacing this deployment's credential does not break every other
        # integration on the account, and a Standard key cannot manage keys or
        # change the account.
        sync: false
      - key: TWILIO_API_KEY_SECRET
        # Shown once, when the key is created. Not recoverable afterwards —
        # a lost secret means a new key.
        sync: false
      - key: TWILIO_AUTH_TOKEN
        # The account's master password. Only used when no API key is set;
        # leave blank once the key above is in place.
        sync: false
      - key: TWILIO_FROM
        # An SMS-capable Twilio number in E.164, or a Messaging Service SID
        # beginning "MG". A trial account can only text numbers verified in the
        # Twilio console, so check the phones used for a walkthrough are on
        # that list before the walkthrough rather than during it.
        sync: false

      # -- error reporting -----------------------------------------------------
      - key: SENTRY_DSN
        # Optional. The error hook is a no-op while this is empty.
        sync: false

  # ---------------------------------------------------------------------------
  # POS — static site. Till, customer display and the Sprint 1 admin panels.
  #
  # Nothing here is upgraded for the paid workspace, and that is the answer
  # rather than an omission: a static site is built once and served from
  # Render's CDN, so there is no instance to size, nothing to autoscale and no
  # health check to run. The paid plan already gives it the only two things it
  # consumes — build minutes and bandwidth — without a line in this file.
  #
  # No `buildFilter` either, though DEPLOYMENT_TOPOLOGY item 1 asks for one. A
  # build filter would stop a commit that touches only the api from rebuilding
  # this site — worth having once there are several static sites in the
  # repository, and worth writing deliberately rather than by guess: the POS
  # imports packages/shared, so a filter naming only `apps/pos/**` would skip
  # a build the site actually needed. Left off until a real build-minute cost
  # justifies getting those paths exactly right.
  # ---------------------------------------------------------------------------
  - type: web
    name: oto-pos-staging
    runtime: static
    branch: main
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @oto/pos build
    staticPublishPath: apps/pos/dist/public
    autoDeployTrigger: checksPass
    routes:
      # THE POS AND THE API ARE ONE ORIGIN IN THE BROWSER. apps/pos/src/api/client.ts
      # calls `/api/...` relative, so this rewrite is what makes the session
      # cookie work: the browser only ever sees the POS origin, the cookie
      # stays httpOnly SameSite=Lax, and no CORS is involved. The rejected
      # alternative (SameSite=None + an allow-list across two origins) is
      # recorded in docs/architecture/ARCHITECTURE.md §16.
      #
      # The `*` carries the rest of the path across, so /api/members/lookup
      # arrives at the api as /members/lookup — the same strip the dev proxy
      # does in apps/pos/vite.config.ts, so the two behave identically.
      #
      # CHECK THIS HOST AFTER THE FIRST DEPLOY. onrender.com subdomains are
      # globally unique: if `oto-api-staging` is taken, Render issues a
      # suffixed hostname and this line must be corrected to match. A blueprint
      # cannot reference another service's URL, so it is a literal.
      - type: rewrite
        source: /api/*
        destination: https://oto-api-staging.onrender.com/*
      # Client-side routing: /admin, /display and the rest are routes inside
      # one bundle, not files on disk. Must stay BELOW the /api rule — Render
      # takes the first match.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_LAUNCHER_URL
        # Read at BUILD time — Vite inlines it into the bundle, so changing it
        # is a rebuild, not a restart. It puts the "Back to the suite" link on
        # the POS lock screen; unset, the link is simply absent, which is what
        # a till on a park counter with no launcher in front of it should see.
        value: https://oto-launcher-staging.onrender.com

  # ---------------------------------------------------------------------------
  # launcher — static site. The suite's front door (S2-02).
  #
  # It signs a person in once and hands them on to an app, so it is a real
  # application rather than a page of links: sign-in, setup and reset, the
  # tiles filtered by `app:<name>:access`, coming-soon shells, and an account
  # page showing the session and its recent hand-off rejections. That is why
  # its origin has to be in the api's ALLOWED_ORIGINS beside the POS.
  #
  # Same shape as the POS above for the same reason: the /api rewrite keeps
  # the launcher's own session cookie same-origin, so development and staging
  # are one code path and no CORS is involved.
  # ---------------------------------------------------------------------------
  - type: web
    name: oto-launcher-staging
    runtime: static
    branch: main
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @oto/launcher build
    staticPublishPath: apps/launcher/dist/public
    autoDeployTrigger: checksPass
    routes:
      # As on the POS: the `*` carries the rest of the path across, so
      # /api/auth/handoff arrives at the api as /auth/handoff. CHECK THIS HOST
      # AFTER THE FIRST DEPLOY — onrender.com subdomains are globally unique
      # and a blueprint cannot reference another service's URL, so it is a
      # literal.
      - type: rewrite
        source: /api/*
        destination: https://oto-api-staging.onrender.com/*
      # Client-side routing. Must stay BELOW the /api rule — Render takes the
      # first match.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Where each tile points, read at BUILD time: Vite inlines these, so
      # changing one is a rebuild, not a restart. A tile whose URL is unset
      # stays "coming soon" rather than putting a dead address on the front
      # door — which is why the rest are deliberately absent here and get
      # added by the ticket that makes each app real: VITE_CONSOLE_URL with
      # S2-03, VITE_OTO_APP_URL with S2-17, VITE_RADAR_URL with S2-18,
      # VITE_BOOTH_URL with S2-07, VITE_INBOX_URL with S2-19.
      #
      # Note what this variable is NOT: it is the address the browser is sent
      # to, while the api's HANDOFF_APP_ORIGINS above is the address the api
      # will accept an exchange from. The two have to agree, and they are
      # deliberately set in different places — one is public and built into a
      # bundle, the other decides whether a credential is honoured.
      - key: VITE_POS_URL
        value: https://oto-pos-staging.onrender.com

# -----------------------------------------------------------------------------
# worker — the future home of PROCESS_ROLES=jobs. Not enabled yet.
#
# Today the api process runs the jobs role itself: pg-boss under advisory
# locks, the watchdog, the analytics rollups and the housekeeping sweeps. That
# is fine while the jobs are small and the api is one instance, and it is wrong
# the moment a rollup's memory or a long sweep starts costing a till its
# response time. It is also step 1 of what lets the api autoscale at all — see
# the note above `numInstances`.
#
# To split it out: uncomment this block, remove `jobs` from the api's
# PROCESS_ROLES (or the same job runs in two processes and fights itself over
# the locks), and give this service the same DATABASE_URL and storage
# variables. It needs no health check and no public URL — a worker has no port.
# The same pattern splits `edge` out later.
#
# This service stays at one instance for the reason the api does: the schedule
# must run once, not once per container. Its pool of 10 is already inside the
# connection budget on the database above.
