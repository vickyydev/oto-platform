      - name: The app's payroll statutory documents checks
        if: steps.changes.outputs.app == 'true'
        run: npx tsx tests/payroll-documents.check.ts
      # SCRUM-570: the company payroll's R5 (no migration) — the files a lock
      # stores: byte-identical to the engine's builders, unchangeable by the
      # trigger, downloads 403 below payroll roles and 404 across park groups,
      # every download audited, and bank + cash = net read from the stored
      # bytes (a mismatched set refused at lock and at mark paid).
      - name: The app's payroll outputs checks
        if: steps.changes.outputs.app == 'true'
        run: npx tsx tests/payroll-outputs.check.ts
      # These five feature suites drive the app's handlers through its own
      # dependency tree. Run them here, where npm ci has installed that tree,
      # and keep the API workspace's ordinary full battery unchanged.
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.app == 'true'
      - name: Install the focused feature review dependencies
        if: steps.changes.outputs.app == 'true'
        working-directory: .
        run: pnpm install --frozen-lockfile --filter '@oto/api...'
      - name: The app's feature runtime reviews
        if: steps.changes.outputs.app == 'true'
        working-directory: .
        env:
          TEST_DATABASE_URL: postgres://oto:oto@localhost:5433/postgres
        run: |
          node -e "require('node:fs').accessSync('apps/oto-app/node_modules/tsx/dist/cli.mjs')"
          mkdir -p test-results
          pnpm --filter @oto/api exec vitest run --pool=forks test/s217c-fix-preview-review.test.ts test/s217c-sop-history-review.test.ts test/s217c-presence-delivery-review.test.ts test/s217c-camp-sms-review.test.ts test/s217c-employee-history-review.test.ts --reporter=default --reporter=json --outputFile.json=../../test-results/feature-runtime.json
          node -e "const r=JSON.parse(require('node:fs').readFileSync('test-results/feature-runtime.json','utf8'));if(r.numPendingTests!==0||r.numTotalTests===0||r.testResults.length!==5)throw new Error('All five feature runtime suites must run without skipped tests')"
      - name: The app's issue reporting review
        if: steps.changes.outputs.app == 'true'
        working-directory: .
        env:
          TEST_DATABASE_URL: postgres://oto:oto@localhost:5433/postgres
        run: |
          pnpm --filter @oto/api exec vitest run --pool=forks test/s548-qa-reports-review.test.ts --reporter=default --reporter=json --outputFile.json=../../test-results/qa-runtime.json
          node -e "const r=JSON.parse(require('node:fs').readFileSync('test-results/qa-runtime.json','utf8'));if(r.numPendingTests!==0||r.numTotalTests===0||r.testResults.length!==1)throw new Error('The QA reporting review must run without skipped tests')"
      - name: The app's scheduling park-group review
        if: steps.changes.outputs.app == 'true'
        working-directory: .
        env:
          TEST_DATABASE_URL: postgres://oto:oto@localhost:5433/postgres
        run: |
          node -e "require('node:fs').accessSync('apps/oto-app/node_modules/tsx/dist/cli.mjs')"
          pnpm --filter @oto/api exec vitest run --pool=forks test/s217b-scheduling-review.test.ts --reporter=default --reporter=json --outputFile.json=../../test-results/scheduling-runtime.json
          node -e "const r=JSON.parse(require('node:fs').readFileSync('test-results/scheduling-runtime.json','utf8'));if(r.numPendingTests!==0||r.numTotalTests===0||r.testResults.length!==1)throw new Error('The scheduling runtime suite must run without skipped tests')"
      # The offboarding duplicate census (read only): on this database, which
      # every check above wrote into, nobody has two open offboardings, so
      # 0038's one-open index stands (0039 retired 0008's one per employee: a
      # profile onboarded again keeps the earlier one as its record).
      - name: The offboarding census
        if: steps.changes.outputs.app == 'true'
        run: npm run offboarding:census
      # Last, over everything the steps above wrote: no settings, activity or
      # attention row without its park group (round 4b's NOT NULL gate), and
      # no template, policy, catalogue item or leave policy without one (0008).
      - name: The tenant ownership read-back
        if: steps.changes.outputs.app == 'true'
        run: npm run tenant:readback

# Staging deploys are not a job here, and deliberately so.
#
# Every Render service is set to auto-deploy with the trigger `checksPass`:
# Render watches this repository, waits for the commit status of the `ci` job
# above, and deploys only when it is green. A red build therefore never
# reaches the staging URL the park team opens, and the deploy needs no
# credential on this side — the alternative, a deploy hook or an API key in
# repository secrets, would put a key to the whole Render workspace in reach
# of anyone who can push a workflow file.
#
# The api deploys first on its own: its pre-deploy step runs the migrations
# and the platform sync before the new instance serves anything.
#
# To see or change it: Render dashboard -> the service -> Settings -> Build &
# Deploy -> Auto-Deploy.
