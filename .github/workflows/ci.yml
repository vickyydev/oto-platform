name: CI

on:
  push:
    paths-ignore: ['imports/**', 'docs/**']
  pull_request:
    paths-ignore: ['imports/**', 'docs/**']
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oto
          POSTGRES_PASSWORD: oto
          POSTGRES_DB: oto
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U oto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://oto:oto@localhost:5433/oto
      TEST_DATABASE_URL: postgres://oto:oto@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Migrations apply cleanly from empty (twice)
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - name: Seed
        run: pnpm db:seed
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build


# Staging deploys are not a job here, and deliberately so.
#
# Both Render services are set to auto-deploy with the trigger `checksPass`:
# Render watches this repository, waits for the commit status of the `ci` job
# above, and deploys only when it is green. A red build therefore never
# reaches the staging URL the park team opens, and the deploy needs no
# credential on this side — the alternative, a deploy hook or an API key in
# repository secrets, would put a key to the whole Render workspace in reach
# of anyone who can push a workflow file.
#
# The api deploys first on its own: its pre-deploy step runs the migrations
# and the platform sync before the new instance serves anything.
#
# To see or change it: Render dashboard -> the service -> Settings -> Build &
# Deploy -> Auto-Deploy.
