name: CI

on:
  push:
    paths-ignore: ['imports/**', 'docs/**']
  pull_request:
    paths-ignore: ['imports/**', 'docs/**']
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oto
          POSTGRES_PASSWORD: oto
          POSTGRES_DB: oto
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U oto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://oto:oto@localhost:5433/oto
      TEST_DATABASE_URL: postgres://oto:oto@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Migrations apply cleanly from empty (twice)
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - name: Seed
        run: pnpm db:seed
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
