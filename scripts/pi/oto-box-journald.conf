# The box's journal is kept on the card (SCRUM-418). Installed by
# scripts/pi/install.sh as /etc/systemd/journald.conf.d/oto-box.conf.
#
# Raspberry Pi OS keeps the journal in memory (Storage=auto with no
# /var/log/journal), so the daily 04:30 reboot erased the previous day's log —
# the one an engineer asks for the morning after a fault. Persistent storage
# keeps it; journald's own default cap (a tenth of the filesystem, at most
# 4 GB) keeps it from filling the card.
[Journal]
Storage=persistent
