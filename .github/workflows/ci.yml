      - name: The app's till billing screens check
        if: steps.changes.outputs.app == 'true'
        env:
          TSX_TSCONFIG_PATH: tests/tsconfig.jsx.json
        run: npx tsx tests/till-billing-ui.check.ts
      # SCRUM-822: the Billing section rendered under jsdom and typed into:
      # Deposit Paid sends one PUT per figure, never an emptied field's 0.
