    <!--
      Inter is served from this build (src/fonts.css), not from
      fonts.googleapis.com: a till that comes up with no internet must come up
      in its own typeface, and a cross-origin stylesheet cannot be there on the
      first offline load. The faces are the same ones Google was sending.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The app's own --background, light and dark, so the iPad's status bar
         matches the screen instead of framing it in white. -->
    <meta name="theme-color" content="#fbf5ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1729" media="(prefers-color-scheme: dark)" />
