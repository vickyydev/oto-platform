<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTO App Map</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #f0f0f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1f1f1f;
      border-bottom: 1px solid #2e2e2e;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #f0f0f0; }
    .subtitle { font-size: 13px; color: #888; margin-top: 2px; }
    .btn-download {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      color: #e0e0e0;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
      font-family: inherit;
    }
    .btn-download:hover { background: #363636; border-color: #4a4a4a; }
    .btn-download:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-download svg { width: 16px; height: 16px; flex-shrink: 0; }
    .legend {
      max-width: 1600px;
      margin: 0 auto;
      padding: 16px 24px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #aaa;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    main {
      flex: 1;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      padding: 8px 16px 32px;
    }
    #diagram-wrap {
      width: 100%;
      overflow-x: auto;
      padding: 8px 0 16px;
    }
    #diagram-wrap svg {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      margin: 0 auto;
      overflow: visible;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      color: #666;
      gap: 12px;
      font-size: 14px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #333;
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes btnSpin { to { transform: rotate(360deg); } }
    .btn-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #555;
      border-top-color: #ccc;
      border-radius: 50%;
      animation: btnSpin 0.8s linear infinite;
    }
    #error-box {
      display: none;
      background: #3d1515;
      border: 1px solid #7f3131;
      border-radius: 8px;
      padding: 16px;
      color: #f87171;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>OTO App Map</h1>
        <p class="subtitle">System overview — how the parts connect</p>
      </div>
      <button class="btn-download" id="btnDownload" onclick="downloadPng()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download as PNG
      </button>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#4a90d9"></span>External Inputs</div>
    <div class="legend-item"><span class="legend-dot" style="background:#4ade80"></span>Core</div>
    <div class="legend-item"><span class="legend-dot" style="background:#2dd4bf"></span>HR</div>
    <div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>Ops</div>
    <div class="legend-item"><span class="legend-dot" style="background:#f472b6"></span>Events</div>
    <div class="legend-item"><span class="legend-dot" style="background:#818cf8"></span>Studio</div>
    <div class="legend-item"><span class="legend-dot" style="background:#94a3b8"></span>Setup</div>
    <div class="legend-item"><span class="legend-dot" style="background:#f97316"></span>Integrations</div>
    <div class="legend-item"><span class="legend-dot" style="background:#a855f7"></span>Analytics</div>
    <div class="legend-item"><span class="legend-dot" style="background:#22d3ee"></span>Public Interfaces</div>
    <div class="legend-item"><span class="legend-dot" style="background:#facc15"></span>Notifications</div>
  </div>

  <main>
    <div id="loading"><div class="spinner"></div>Rendering diagram…</div>
    <div id="error-box"></div>
    <div id="diagram-wrap" style="display:none"></div>
  </main>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        background: '#1a1a1a',
        mainBkg: '#242424',
        nodeBorder: '#555',
        clusterBkg: '#252525',
        clusterBorder: '#3a3a3a',
        titleColor: '#f0f0f0',
        edgeLabelBackground: '#2a2a2a',
        fontFamily: 'Inter, -apple-system, sans-serif',
        fontSize: '13px',
        lineColor: '#666',
      },
      flowchart: {
        htmlLabels: true,
        curve: 'basis',
        padding: 20,
        nodeSpacing: 36,
        rankSpacing: 56,
      },
    });

    const diagram = `
flowchart TD
    subgraph EXT["🌐  EXTERNAL INPUTS"]
        direction LR
        MANUAL["📝 Manual Staff Inputs"]
        WHATSAPP["💬 WhatsApp / Team Chat"]
        TRELLO["📋 Trello / Project Planning"]
    end

    POS["🖥️ POS System"]

    subgraph SUITE["⚙️  OTO SUITE"]
        subgraph CORE_MOD["CORE"]
            direction LR
            TODAY["Today View"]
            CHECKINS["Check-ins"]
            FIXBOARD["Fix Board"]
            VOUCHERS["Vouchers"]
        end
        subgraph HR_MOD["HR"]
            direction LR
            EMPLOYEES["Employees & Contracts"]
            PAYROLL["Payroll"]
            SCHEDULING["Scheduling / Timekeeping"]
            ORGCHART["Org Chart"]
            RBAC["Permissions / RBAC"]
            LEAVE["Leave & Policies"]
        end
        subgraph OPS_MOD["OPS"]
            direction LR
            TASKS["Tasks & Checklists"]
            ANNOUNCE["Announcements"]
            RECURRING["Recurring Items"]
        end
        subgraph EVENTS_MOD["EVENTS"]
            direction LR
            EVENTMGMT["Event Management"]
            BEO["BEO Planning"]
            SETMENUS["Set Menus"]
        end
        subgraph STUDIO_MOD["STUDIO"]
            direction LR
            SOPKB["Knowledge Base / SOPs"]
            ASKAI["ASK OTO AI"]
            TEMPLATES["Contract Templates"]
            HIRING["Hiring Infographics"]
        end
        subgraph SETUP_MOD["SETUP"]
            direction LR
            BRANCHES["Branches & Departments"]
            ROLES["Roles"]
            VAULT["Vault / Access"]
            HOLIDAYS["Public Holiday Settings"]
        end
        NOTIF(["🔔 Notification System"])
    end

    subgraph INTEGRATIONS["🔗  INTEGRATIONS"]
        XERO["⬌  Xero Finance Sync"]
        GSHEETS["⬌  Google Sheets / CSV"]
    end

    subgraph ANALYTICS["📊  OUTPUTS & ANALYTICS"]
        direction LR
        REVENUE["Revenue Dashboards"]
        SALES["Sales / Category Analysis"]
        BRANCH_CMP["Branch Comparison"]
        FORECAST["Forecasting / KPI Views"]
    end

    subgraph PUBLIC["🏛️  PUBLIC INTERFACES"]
        KIOSK["Kiosk / Reception QR"]
        PARENT["Parent Portal"]
        SUPPLIER["Supplier Portal"]
    end

    EXT --> SUITE
    POS -. "Weak / Future link" .-> SUITE
    SUITE <--> INTEGRATIONS
    SUITE --> ANALYTICS
    SUITE --> PUBLIC
    NOTIF --> EMPLOYEES
    NOTIF --> TODAY

    classDef extInput fill:#1e3a5f,stroke:#4a90d9,color:#a8d0f0,stroke-width:2px
    classDef coreModule fill:#1a3a2a,stroke:#4ade80,color:#86efac,stroke-width:2px
    classDef hrModule fill:#0f3330,stroke:#2dd4bf,color:#99f6e4,stroke-width:2px
    classDef opsModule fill:#3d2400,stroke:#f59e0b,color:#fcd34d,stroke-width:2px
    classDef eventsModule fill:#3d1529,stroke:#f472b6,color:#fbcfe8,stroke-width:2px
    classDef studioModule fill:#1e1b4b,stroke:#818cf8,color:#c7d2fe,stroke-width:2px
    classDef setupModule fill:#1e293b,stroke:#94a3b8,color:#cbd5e1,stroke-width:2px
    classDef integration fill:#3d2000,stroke:#f97316,color:#fed7aa,stroke-width:2px
    classDef analytics fill:#2d1f4e,stroke:#a855f7,color:#e9d5ff,stroke-width:2px
    classDef publicNode fill:#0f2f3a,stroke:#22d3ee,color:#a5f3fc,stroke-width:2px
    classDef posNode fill:#1e3a5f,stroke:#60a5fa,color:#bfdbfe,stroke-width:2px,stroke-dasharray:6 4
    classDef notifNode fill:#292015,stroke:#facc15,color:#fef08a,stroke-width:2px

    class MANUAL,WHATSAPP,TRELLO extInput
    class TODAY,CHECKINS,FIXBOARD,VOUCHERS coreModule
    class EMPLOYEES,PAYROLL,SCHEDULING,ORGCHART,RBAC,LEAVE hrModule
    class TASKS,ANNOUNCE,RECURRING opsModule
    class EVENTMGMT,BEO,SETMENUS eventsModule
    class SOPKB,ASKAI,TEMPLATES,HIRING studioModule
    class BRANCHES,ROLES,VAULT,HOLIDAYS setupModule
    class XERO,GSHEETS integration
    class REVENUE,SALES,BRANCH_CMP,FORECAST analytics
    class KIOSK,PARENT,SUPPLIER publicNode
    class POS posNode
    class NOTIF notifNode
`;

    async function renderDiagram() {
      try {
        const { svg } = await mermaid.render('mermaid-chart', diagram);
        document.getElementById('loading').style.display = 'none';
        const wrap = document.getElementById('diagram-wrap');
        wrap.innerHTML = svg;
        wrap.style.display = 'block';
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        const box = document.getElementById('error-box');
        box.textContent = 'Diagram render error:\n' + String(err);
        box.style.display = 'block';
      }
    }

    renderDiagram();

    async function downloadPng() {
      const btn = document.getElementById('btnDownload');
      btn.disabled = true;
      btn.innerHTML = '<div class="btn-spinner"></div>Exporting…';

      try {
        const svg = document.querySelector('#diagram-wrap svg');
        if (!svg) { alert('Diagram not ready yet.'); return; }

        const svgData = new XMLSerializer().serializeToString(svg);
        const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            const scale = 2;
            const canvas = document.createElement('canvas');
            canvas.width = (img.naturalWidth || svg.getBoundingClientRect().width) * scale;
            canvas.height = (img.naturalHeight || svg.getBoundingClientRect().height) * scale;
            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);

            canvas.toBlob(pngBlob => {
              if (!pngBlob) { reject(new Error('Canvas export failed')); return; }
              const link = document.createElement('a');
              link.href = URL.createObjectURL(pngBlob);
              link.download = 'oto-app-map.png';
              link.click();
              setTimeout(() => URL.revokeObjectURL(link.href), 5000);
              resolve();
            }, 'image/png');
          };
          img.onerror = reject;
          img.src = url;
        });
      } catch (err) {
        console.error('PNG export failed:', err);
        alert('Export failed. Try right-clicking the diagram and saving as image.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download as PNG`;
      }
    }
  </script>
</body>
</html>
