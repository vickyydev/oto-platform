<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover gives the safe-area insets a value on a phone with a home bar
         (the assistant's floating button sits above it); interactive-widget=resizes-content
         makes a phone keyboard shrink the layout, so the chat popup's composer stays above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>OTO Suite</title>
    <meta name="description" content="The front door to OTO Park's apps — sign in once and open the till, the console and the rest of the suite." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <meta property="og:title" content="OTO Suite" />
    <meta property="og:description" content="The front door to OTO Park's apps — sign in once and open the till, the console and the rest of the suite." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
