      - name: The app's payroll profile editor check
        if: steps.changes.outputs.app == 'true'
        env:
          TSX_TSCONFIG_PATH: tests/tsconfig.jsx.json
        run: npx tsx tests/payroll-profile-editor.check.tsx
      # SCRUM-572 (R7, the payroll UI cutover): the access check over the
