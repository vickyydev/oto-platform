name: CI

on:
  push:
    paths-ignore: ['imports/**', 'docs/**']
  pull_request:
    paths-ignore: ['imports/**', 'docs/**']
  workflow_dispatch:

# Two agent lanes push several times an hour, and a run superseded by a newer
# push proves nothing anyone waits for: Render deploys the newest green
# commit, and the Pi release is fetched for tips, not intermediates. One
# in-flight run per branch; newer pushes QUEUE behind it rather than cancel
# it: with two lanes pushing, a cancelled run left main's workspace suite
# unproven while a later app-only push went green by path gate — and the
# deploys ride whatever green comes. A queued run always finishes its tree.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oto
          POSTGRES_PASSWORD: oto
          POSTGRES_DB: oto
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U oto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://oto:oto@localhost:5433/oto
      TEST_DATABASE_URL: postgres://oto:oto@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      # What this push actually changed, so the expensive steps below can be
      # skipped when they prove nothing about it. CONSERVATIVE BY CONSTRUCTION:
      # if the base commit cannot be fetched or diffed — a force push, the
      # first push of a branch, anything surprising — every flag is true and
      # the whole job runs. The flags:
      #   workspace — any change outside apps/oto-app (that app sits outside
      #               the pnpm workspace, so typecheck/lint/test/build say
      #               nothing about it; its own guard is the redaction-sync
      #               step, which always runs)
      #   db        — packages/db changed, so migrations and seed are re-proven
      #   e2e       — the Console browser set exercises the built Console AND
      #               the api behind it, so console, api, packages, the
      #               lockfile or this workflow changed
      #   pi        — what the Pi release is packed from changed
      - name: What changed
        id: changes
        shell: bash
        run: |
          set -u
          BASE='${{ github.event.pull_request.base.sha || github.event.before }}'
          all() { for f in workspace db e2e pi; do echo "$f=true" >> "$GITHUB_OUTPUT"; done; }
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base — running everything"; all; exit 0
          fi
          git fetch --quiet --depth=1 origin "$BASE" || { echo "base unfetchable — running everything"; all; exit 0; }
          FILES=$(git diff --name-only "$BASE" "$GITHUB_SHA") || { echo "diff failed — running everything"; all; exit 0; }
          echo "$FILES"
          flag() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          if echo "$FILES" | grep -q -v -E '^apps/oto-app/'; then flag workspace true; else flag workspace false; fi
          if echo "$FILES" | grep -q -E '^packages/db/'; then flag db true; else flag db false; fi
          if echo "$FILES" | grep -q -E '^(apps/console/|apps/api/|packages/|pnpm-lock.yaml|.github/workflows/ci.yml)'; then flag e2e true; else flag e2e false; fi
          if echo "$FILES" | grep -q -E '^(packages/|apps/booth/|scripts/pi/)'; then flag pi true; else flag pi false; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: steps.changes.outputs.workspace == 'true'
        run: pnpm typecheck
      - name: Lint
        if: steps.changes.outputs.workspace == 'true'
        run: pnpm lint
      # One member record, and it is the platform's (S2-09b, SCRUM-204).
      # `apps/pos/src/mockApi.ts` still carries the prototype's fixture
      # members, and a screen that reads them finds a family the platform does
      # not have. This fails when a file under apps/pos/src other than
      # mockApi.ts imports one of its member functions, naming the file and
      # the line. Plain Node and the TypeScript parser the install brings.
      - name: No screen reads mock members
        if: steps.changes.outputs.workspace == 'true'
        run: node scripts/check-no-mock-members.mjs
      # The lifted OTO App carries a byte-for-byte copy of the platform's
      # redactor, because it is outside the pnpm workspace and cannot import
      # @oto/telemetry. A copy nobody checks is a copy that diverges, and the
      # divergence shows up as a phone number in a log line months later. This
      # is plain Node with no dependencies, so it needs no install of that
      # app's 1,120 packages.
      - name: Vendored redaction has not drifted
        run: node apps/oto-app/server/lib/telemetry/check-sync.mjs
      - name: Migrations apply cleanly from empty (twice)
        if: steps.changes.outputs.db == 'true'
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - name: Seed
        if: steps.changes.outputs.db == 'true'
        run: pnpm db:seed
      # The Console's unit tests (SCRUM-256): the booth's odds and money
      # arithmetic, what blocks a publish, and the voucher-type form. A step of
      # their own so a red one is named in the run's summary. Through turbo, so
      # the Test step below replays this result from the cache rather than
      # running the suite a second time.
      - name: Console tests
        if: steps.changes.outputs.workspace == 'true'
        run: pnpm test --filter=@oto/console
      # The print package rasterises fonts and bitmaps. Alone on the runner its
      # workers stay responsive; beside every other suite they starve and
      # vitest's worker reporting times out with every test passed. Its own
      # step first; the Test step below replays it from the turbo cache.
      - name: Print tests
        if: steps.changes.outputs.workspace == 'true'
        run: pnpm test --filter=@oto/print
      # --continue: every package reports, so one red suite cannot hide another.
      - name: Test
        if: steps.changes.outputs.workspace == 'true'
        run: pnpm test --continue
      - name: Build
        if: steps.changes.outputs.workspace == 'true'
        run: pnpm build
      # The Pi release (SCRUM-422; the closing audit's M4 and L52). The box
      # installs `oto-box-<version>-<commit>.tgz`, and the guide says the file
      # comes from us with its SHA-256 — but nothing packed it except a
      # developer's machine, where the only packed file was stale. Every run of
      # this job now packs it at the commit it just tested and keeps it three
      # weeks as the artifact named for that commit, the checksum beside it in
      # `sha256sum -c` form. The install and service scripts are parsed first:
      # a script bash cannot read was otherwise found on the Pi, at install time.
      - name: Pi scripts parse
        if: steps.changes.outputs.pi == 'true'
        run: |
          for f in scripts/pi/*.sh; do bash -n "$f"; done
          # ubuntu-latest carries shellcheck. An error fails the job; warnings
          # and notes print for the eye and do not — three stand today, kept
          # with SCRUM-422's lint part. A runner without it parses only.
          if command -v shellcheck >/dev/null; then
            shellcheck --severity=error scripts/pi/*.sh
            shellcheck scripts/pi/*.sh || true
          else
            echo "shellcheck is not on this runner; bash -n only"
          fi
      # What the packer is about to read. `build-runner.mjs` names the tarball
      # `+local` when git shows a change under packages/, apps/booth or
      # scripts/pi, and the first release this job packed was named that way:
      # `pnpm install` had marked packages/box-agent/bin/oto-box.mjs executable
      # — pnpm does that to every bin it links, on every OS but Windows — and a
      # mode flip is a modification to git on this runner, though never on the
      # Windows machines the package is developed on. The packer now sets mode
      # bits aside; this prints what git sees, with `git diff --summary` naming
      # a mode flip as one, so whatever dirties the tree next time is read in
      # the log rather than off the tarball's name.
      - name: Working tree before the pack
        if: steps.changes.outputs.pi == 'true'
        run: |
          git status --porcelain
          git diff --summary
          if [ -z "$(git status --porcelain)" ]; then echo "clean"; fi
      - name: Pack the Pi release
        if: steps.changes.outputs.pi == 'true'
        id: pack
        run: |
          pnpm --filter @oto/box-agent pack:pi
          cd packages/box-agent/dist
          set -- oto-box-*-"$(git rev-parse --short HEAD)"*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one tarball for HEAD in dist/, found: $*"; exit 1; }
          # A release packed here is the commit's, and its name says so. A
          # `+local` name is a slip; the step above shows what caused it.
          case "$1" in
            *+local*) echo "::warning title=Pi release packed from a dirty tree::$1 — see the step 'Working tree before the pack'" ;;
          esac
          sha256sum "$1" | tee "$1.sha256"
          echo "tarball=packages/box-agent/dist/$1" >> "$GITHUB_OUTPUT"
      - name: Upload the Pi release
        if: steps.changes.outputs.pi == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oto-box-${{ github.sha }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 21
      # The Console's end-to-end set (SCRUM-365). It brings its own database:
      # `e2e/run.mjs` creates one on the server `TEST_DATABASE_URL` names — the
      # Postgres service above — migrates and seeds it, starts the api (with
      # the `edge` role, so the virtual box is there to take a queued test
      # print) and the Vite dev server against it on two free ports, drives
      # them in a browser, and drops the database on the way out. Nothing here
      # needs adding to the job's env: every api variable but DATABASE_URL is
      # defaulted (apps/api/src/env.ts), and the harness supplies that one.
      #
      # ON CHROMIUM rather than the Edge the config defaults to. These runners
      # are ubuntu-latest, where Edge would mean adding Microsoft's package
      # repository to the image; Chromium is the browser Playwright ships for
      # Linux, and `--with-deps` brings the system libraries it needs with it.
      # Locally the set keeps Edge, which is the Chromium already on the
      # machines here.
      - name: Install Chromium for the Console end-to-end set
        if: steps.changes.outputs.e2e == 'true'
        run: pnpm --filter @oto/console exec playwright install --with-deps chromium
      - name: Console end-to-end
        if: steps.changes.outputs.e2e == 'true'
        run: pnpm --filter @oto/console e2e
        env:
          CONSOLE_E2E_BROWSER: chromium
          CONSOLE_E2E_BUILT: '1'  # the browser tests run against the built bundle, what ships (SCRUM-422)
      # A failed case leaves a screenshot and its error context in the HTML
      # report, and the report is the only way to read a red run from here —
      # the log says which case failed and not what the page looked like when
      # it did.
      - name: Console end-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-e2e-report
          path: |
            apps/console/playwright-report
            apps/console/test-results
          if-no-files-found: ignore
          retention-days: 7


# Staging deploys are not a job here, and deliberately so.
#
# Every Render service is set to auto-deploy with the trigger `checksPass`:
# Render watches this repository, waits for the commit status of the `ci` job
# above, and deploys only when it is green. A red build therefore never
# reaches the staging URL the park team opens, and the deploy needs no
# credential on this side — the alternative, a deploy hook or an API key in
# repository secrets, would put a key to the whole Render workspace in reach
# of anyone who can push a workflow file.
#
# The api deploys first on its own: its pre-deploy step runs the migrations
# and the platform sync before the new instance serves anything.
#
# To see or change it: Render dashboard -> the service -> Settings -> Build &
# Deploy -> Auto-Deploy.
