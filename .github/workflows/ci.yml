      - name: The app's payroll configuration checks
        if: steps.changes.outputs.app == 'true'
        run: npx tsx tests/payroll-config.check.ts
      # SCRUM-567: the profile editor's "Proposed from HR data" panel on the
      # real page under jsdom — every Use lands in the form and shows as in
