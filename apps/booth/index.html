<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>OTO Lucky Wheel</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <!--
      Who served this page (SCRUM-223): `paired` as built — the staging site,
      where a screen is paired to a booth — and rewritten to `box` by a booth
      box serving it to the television plugged into it. See src/booth/host.ts.
    -->
    <meta name="oto-booth-host" content="paired" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Thai on the television renders in Noto Sans Thai (D23): the park's brand
      faces have no Thai glyphs, and every prize on this wheel is named in both
      languages on the result card.

      Nothing here fetches it, on purpose. A stylesheet in this <head> holds
      back the page's script until it arrives, so a booth with no fresh copy of
      Google's sheet, on a network that dropped traffic to Google, showed a
      white screen and a dead button until the request gave up. The page asks
      Google for the face itself, once it has loaded
      (GOOGLE_FONT_STYLESHEET in src/App.tsx). Until that answers, and for good
      on a booth that never reaches Google, Thai is drawn in 'Booth Thai' from
      src/kiosk.css: the same face, built into the page from packages/print/fonts,
      so a Raspberry Pi with no Thai font of its own still draws Thai (SCRUM-223).
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
