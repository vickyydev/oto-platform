name: Focused repair checks
on:
  push:
    branches: [verify/repair-focused-20261128]
permissions:
  contents: read
jobs:
  api-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter '@oto/api...' --filter '@oto/pos...' --filter oto-platform --frozen-lockfile
      - run: pnpm --filter @oto/api exec tsc -p tsconfig.json --noEmit --pretty false
        env:
          NODE_OPTIONS: --max-old-space-size=4096
